<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-default>Communitas - Building Stronger Neighborhoods</title>
       <script>
      (function() {
        // Restore redirect from 404.html
        var redirect = sessionStorage.getItem('redirect');
        sessionStorage.removeItem('redirect');
        if (redirect) {
          history.replaceState(null, null, redirect);
        }

        // Redirect hash-based auth to /auth/callback
        var hash = window.location.hash;
        if (hash && (hash.includes('access_token=') || hash.includes('error=') || hash.includes('type=recovery'))) {
          window.location.replace('/convees/auth/callback' + window.location.search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
