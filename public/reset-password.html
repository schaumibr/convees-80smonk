<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - Convees</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F0FDF4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #1E293B;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        form {
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            margin-bottom: 16px;
            outline: none;
            background: #fff;
        }
        input[type="password"]:focus {
            border-color: #208AEF;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #208AEF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.error {
            display: block;
            background-color: #FEF2F2;
            color: #DC2626;
        }
        .message.success {
            display: block;
            background-color: #F0FDF4;
            color: #16A34A;
        }
        .app-name {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 32px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Set New Password</h1>
        <p>Enter your new password below.</p>

        <form id="resetForm" onsubmit="handleSubmit(event)">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="Enter new password" required minlength="8">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8">

            <button type="submit" id="submitBtn">Update Password</button>
        </form>

        <div id="message" class="message"></div>

        <p class="app-name">Convees</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        var SUPABASE_URL = 'https://wnweqxekguwqgyzjqqtm.supabase.co';
        var SUPABASE_ANON_KEY = 'sb_publishable_ykZrHF6yMYexN5OCF_sLgA_kyNuHgeO';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('submitBtn');

            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('Password must be at least 8 characters.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                var result = await supabase.auth.updateUser({ password: password });
                if (result.error) {
                    showMessage(result.error.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                } else {
                    showMessage('Password updated successfully! You can close this page and sign in with your new password.', 'success');
                    document.getElementById('resetForm').style.display = 'none';
                }
            } catch (err) {
                showMessage('Something went wrong. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }
    </script>
</body>
</html>
