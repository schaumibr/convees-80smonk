<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Verified - Convees</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #EFF6FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #1E293B;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .app-name {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Account Verified!</h1>
        <p>Your email has been successfully verified.</p>
        <p>You can now close this page and sign in to the Convees app.</p>
        <p class="app-name">Convees</p>
    </div>
</body>
</html>
